[package]
name = "protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# Wire tests share one explicit integration target.
autotests = false

[package.metadata.cinnabar]
platform-specific = ["windows", "macos"]
reads = [
    "core/go.mod",
    "core/proxy/resource_pack_window.txt",
    "assets/bedrock-target.json",
    "assets/block-data-sources.json",
    "crates/protocol-ids/data/protocol-ids.json",
    "crates/protocol-ids/data/actor-data-extensions.json",
    "crates/protocol-ids/data/movement-contract.json",
    "tools/localserver/experience/testdata/protocol/limits.json",
]

[features]
# Fixture builders and semantic observations for other crates' tests.
test-support = []
native-networking = ["dep:bedrock-net", "dep:p384", "dep:rand", "dep:nethernet", "dep:nethernet-tokio", "dep:rustls", "dep:reqwest", "uuid/serde"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[[example]]
name = "native-join"
required-features = ["native-networking"]

[dependencies]
bedrock-client.workspace = true
bedrock-packs.workspace = true
resource-pack = { path = "../resource-pack" }
protocol-ids = { path = "../protocol-ids" }
simulation-clock = { path = "../simulation-clock" }
zeroize = "1"
block-transform = { path = "../block-transform" }
render-api = { path = "../render-api" }
anyhow.workspace = true
base64 = "0.22"
bridge = { path = "../bridge" }
bytes.workspace = true
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
web-time.workspace = true
uuid = { workspace = true, features = ["v4"] }
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
bedrock-protocol-1-26-51 = { git = "https://github.com/cinnabar-mc/protocolgen", rev = "4e9626abbb51b8fa842f49b4aea0fb4d3c01a682" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
cap-std = "3.4.5"
cap-fs-ext = "3.4.5"
bedrock-net = { workspace = true, features = ["raknet", "login", "messaging"], optional = true }
p384 = { version = "0.14", default-features = false, features = ["std", "ecdsa", "ecdh", "pkcs8"], optional = true }
rand = { version = "0.10", optional = true }
nethernet-tokio = { workspace = true, optional = true }
nethernet = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[dev-dependencies]
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["std", "sha2"] }
resource-pack = { path = "../resource-pack", features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
test-alloc = { path = "../test-alloc" }
tempfile = "3"
test-time = { path = "../test-time" }

[lints]
workspace = true
