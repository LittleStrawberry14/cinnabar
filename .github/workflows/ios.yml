name: iOS

on:
  workflow_dispatch:
  push:
    paths:
      - packaging/ios/**
      - .github/workflows/ios.yml
      - Cargo.toml
      - Makefile
      - assets/**
      - app/**
      - crates/**

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: unsigned IPA
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + iOS target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.99.0
          rustup default 1.99.0
          rustc --version

      # Reuse Cargo downloads and compiled dependencies between runs. The lockfile and
      # toolchain define the cache generation; target-specific artifacts stay isolated.
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
            target/aarch64-apple-ios
          key: ios-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ios-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ios-rust-${{ runner.os }}-

      - name: Build unsigned IPA
        run: |
          chmod +x packaging/ios/build-ipa.sh
          bash packaging/ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinnabar-ios-unsigned
          path: |
            target/ios/cinnabar-ios-unsigned.ipa
            target/ios/build.log
          if-no-files-found: warn
          retention-days: 7
