name: iOS

on:
  workflow_dispatch:
  push:
    paths:
      - packaging/ios/**
      - .github/workflows/ios.yml
      - Cargo.toml
      - app/**
      - crates/**

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: unsigned IPA
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + iOS target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.99.0
          rustup default 1.99.0
          rustc --version

      - name: Build unsigned IPA
        run: |
          chmod +x packaging/ios/build-ipa.sh
          bash packaging/ios/build-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cinnabar-ios-unsigned
          path: |
            target/ios/cinnabar-ios-unsigned.ipa
            target/ios/build.log
          if-no-files-found: error
          retention-days: 7
