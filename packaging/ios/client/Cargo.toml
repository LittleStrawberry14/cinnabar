[package]
name = "cinnabar-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]
doctest = false

[dependencies]
anyhow.workspace = true

# Pull the real client the same way Android does. This will surface iOS compile errors.
[target.'cfg(target_os = "ios")'.dependencies]
cinnabar = { path = "../../../app", default-features = false }
launcher = { path = "../../../crates/launcher" }

[lints]
workspace = true
